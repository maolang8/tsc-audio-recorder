<!doctype html>
<html lang="ko">
<meta charset="utf-8">

<title>TSC 답변 녹음</title>
<style>
body{margin:0;background:#faf8f2;color:#183047;font:1rem system-ui,sans-serif}
main{max-width:30rem;margin:12vh auto;padding:2rem}
button{background:#244b76;color:white;border:0;border-radius:.65rem;padding:.85rem 1.25rem;font:inherit;margin:.5rem .5rem .5rem 0}

</style>
<main>

  <button id="start" disabled>녹음 시작</button>
  <button id="stop" disabled>녹음 완료</button>
  <button id="cancel">시험 화면으로 돌아가기</button>
</main>
<script src="record.js"></script>
</html>
